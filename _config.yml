title: Leonard's Blog
description: Notes on software, products, and long-term learning.
lang: zh-CN
timezone: Asia/Shanghai

url: ""
baseurl: ""

permalink: /posts/:year/:month/:day/:title/

markdown: kramdown
highlighter: rouge

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: Leonard
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
